{% extends "base.html" %}
{% block title %}Регистрация china-auto-tur{% endblock %}
{% block content %}<section class="sec"><div class="wrap narrow">
  <h1>Регистрация</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" class="form">{% csrf_token %}
    <label>Логин</label><input name="username" required>
    <label>Пароль</label><input type="password" name="password1" required>
    <label>Пароль ещё раз</label><input type="password" name="password2" required>
    <button class="btn red">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a class="link" href="/accounts/login/">Войти</a></p>
</div></section>{% endblock %}
