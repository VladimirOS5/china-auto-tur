<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}China Auto Tur{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    {% block meta %}{% endblock %}
  </head>
  <body>
    <!-- Шапка -->
    <header class="header">
      <div class="container">
        <div class="header__logo">
          <a href="/" class="logo">CHINA-AUTO-TUR</a>
        </div>
        <nav class="header__nav">
          <a href="/catalog/" class="nav-link">Каталог</a>
          <a href="/about/" class="nav-link">О компании</a>
          <a href="/news/" class="nav-link">Новости</a>
          <a href="/contacts/" class="nav-link">Контакты</a>
        </nav>
        <div class="header__actions">
          <a href="tel:+74950000000" class="header__phone"
            >+7 (495) 000-00-00</a
          >
          <button class="btn btn--primary btn--m">Заказать авто</button>
        </div>
      </div>
    </header>

    <!-- Контент -->
    <main class="main">{% block content %}{% endblock %}</main>

    <!-- Футер -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 China Auto Tur. Все права защищены.</p>
      </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
